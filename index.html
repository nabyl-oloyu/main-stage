<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Main Stage</title>
<meta name="theme-color" content="#07050b">
<meta name="description" content="Tu disciplina es tu carrera de DJ.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Main Stage">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style id="estilos">
:root{
  /* El club visto desde la pista: el canvas es la escena, la interfaz es una consola de DJ flotando encima */
  --ink:#07050b;
  --glass:rgba(13,9,19,.74);
  --line:rgba(255,255,255,.13);
  --text:#f6f1ea;
  --muted:rgba(246,241,234,.64);
  --c1:#ff9f43;
  --c2:#ff4f6d;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;background:var(--ink);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{-webkit-user-select:text;user-select:text;font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--c1)}
select option{background:#140e1c}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}

/* Barras de cine */
.lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:30;transition:height .7s cubic-bezier(.7,0,.2,1);pointer-events:none}
.lb.t{top:0}.lb.b{bottom:0}
body.cine .lb{height:10vh}

/* HUD superior */
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:calc(18px + env(safe-area-inset-top)) 22px 18px;z-index:10;pointer-events:none;transition:opacity .6s}
#top>*{pointer-events:auto}
.brandline{display:flex;gap:12px;align-items:center;white-space:nowrap}
.logo-s{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.32em}
.night{font-size:11px;color:var(--muted);letter-spacing:.14em;padding:3px 8px;border:1px solid var(--line);border-radius:99px}
.venue{font-family:var(--display);font-weight:900;font-size:clamp(34px,5.4vw,60px);line-height:.95;text-transform:uppercase;letter-spacing:.01em;margin-top:6px;text-shadow:0 0 28px color-mix(in srgb,var(--c1) 55%,transparent);text-wrap:balance}
.vprog{margin-top:8px;width:min(320px,52vw)}
.vrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.vbar{height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:5px}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:inherit;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tl{min-width:0}
.tr{display:flex;gap:8px;align-items:center;flex:none}
.stat{display:grid;justify-items:end;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:7px 13px}
.stat .k{font:600 10px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:20px;font-weight:600;line-height:1.15}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);position:relative}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{border-color:rgba(255,255,255,.3)}
.ib.dirty::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--c1);box-shadow:0 0 8px var(--c1)}

/* Medidor de energía */
#vu{position:fixed;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:4px;z-index:9;pointer-events:none;transition:opacity .6s}
#vu span{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.08)}
#vu span.on{background:var(--c1);box-shadow:0 0 8px var(--c1)}
#vu span.on.hot{background:var(--c2);box-shadow:0 0 8px var(--c2)}
#vu b{font:600 9px/1 var(--mono);letter-spacing:.16em;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);margin-bottom:8px;align-self:center}

/* Set de hoy */
#set{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:60px 22px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(5,3,8,.95) 40%,rgba(5,3,8,0));transition:transform .7s cubic-bezier(.7,0,.2,1),opacity .6s}
body.cab #set{transform:translateY(110%);opacity:0}
.set-h{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.set-t{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.set-c{color:var(--c1);font-size:14px}
.sp{flex:1}
.ex{margin:-4px 0 10px;font-size:13px;color:var(--muted)}
.tracks{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.trk{flex:1 0 180px;max-width:260px;display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);transition:transform .2s,border-color .2s,box-shadow .3s}
.trk:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3)}
.trk-top,.trk-b{display:flex;justify-content:space-between;align-items:center;gap:8px}
.no{font-size:12px;color:var(--muted)}
.key{font-size:10px;color:var(--muted);letter-spacing:.08em}
.tn{font-weight:600;line-height:1.25;min-height:2.5em}
.wf{height:22px;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 4px);-webkit-mask:linear-gradient(transparent 0,#000 0) ,radial-gradient(60% 100% at 30% 50%,#000,transparent);mask:radial-gradient(70% 120% at 35% 50%,#000 30%,rgba(0,0,0,.35) 70%)}
.tf{font-size:12px;color:var(--c1)}
.ts{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:99px;border:1px solid var(--line)}
.trk.on{border-color:color-mix(in srgb,var(--c1) 70%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--c1) 30%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--c1) 40%,transparent)}
.trk.on .wf{background:repeating-linear-gradient(90deg,var(--c1) 0 2px,transparent 2px 4px)}
.trk.on .ts{background:var(--c1);border-color:var(--c1);color:#140a02}
.btn{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);border-radius:99px;padding:10px 18px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn.primary{background:var(--c1);border-color:var(--c1);color:#140a02}
.btn.sm{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Anuncios */
#announce{position:fixed;inset:0;display:grid;place-content:center;text-align:center;z-index:31;pointer-events:none;opacity:0;transition:opacity .5s;padding:0 20px}
#announce.show{opacity:1}
.an-small{font:600 13px/1.3 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--text);opacity:.85;margin-bottom:10px}
.an-big{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(54px,12vw,160px);line-height:.85;letter-spacing:.01em;background:linear-gradient(180deg,#fff 20%,var(--c1) 70%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px color-mix(in srgb,var(--c2) 60%,transparent));text-wrap:balance}
#announce.show .an-big{animation:slam .7s cubic-bezier(.2,1.4,.3,1) both}
@keyframes slam{from{transform:scale(1.5);opacity:0;letter-spacing:.2em}}
#lower{position:fixed;left:22px;bottom:275px;z-index:12;pointer-events:none;display:flex;align-items:stretch;gap:12px;opacity:0;transform:translateX(-24px);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
#lower.show{opacity:1;transform:none}
#lower .bar{width:4px;border-radius:4px;background:linear-gradient(var(--c1),var(--c2))}
#lower .l1{font:600 11px/1.3 var(--mono);letter-spacing:.24em;color:var(--c1)}
#lower .l2{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.5vw,36px);line-height:1.05;text-transform:uppercase}
#lower .l3{font-size:13px;color:var(--muted)}

/* Intro y portada */
#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,rgba(5,3,8,.55),rgba(5,3,8,.94) 70%);transition:opacity 1.3s;padding:20px}
#intro.out{opacity:0;pointer-events:none}
.line{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.4vw,48px);text-align:center;max-width:22ch;line-height:1.1;margin:0;animation:fadeline 2.9s ease both;text-wrap:balance}
@keyframes fadeline{0%{opacity:0;transform:translateY(10px);filter:blur(6px)}18%,78%{opacity:1;transform:none;filter:none}100%{opacity:0;filter:blur(4px)}}
.skip{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));border:0;background:none;color:var(--muted);font:600 12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase}
.title{display:grid;justify-items:center;text-align:center;gap:14px;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:scale(.94);filter:blur(10px)}}
.kicker{margin:0;font:600 13px/1.3 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.logo{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(92px,19vw,230px);line-height:.8;letter-spacing:.005em;background:linear-gradient(180deg,#fff 15%,var(--c1) 60%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px color-mix(in srgb,var(--c2) 45%,transparent))}
.recap{margin:4px 0 8px;max-width:44ch;color:var(--text);opacity:.86}
.enter{position:relative;border:0;border-radius:99px;padding:18px 42px;background:var(--c1);color:#140a02;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.12em;text-transform:uppercase}
.enter::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid var(--c1);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.96)}to{opacity:0;transform:scale(1.25)}}
.small{margin:0;font-size:12px;color:var(--muted);letter-spacing:.08em}

/* Cabina */
#cabin{position:fixed;right:58px;top:50%;width:min(340px,calc(100vw - 32px));transform:translate(30px,-50%);opacity:0;pointer-events:none;z-index:12;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:20px;transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1);display:grid;gap:14px}
body.cab #cabin{opacity:1;transform:translate(0,-50%);pointer-events:auto}
.cab-h{display:flex;justify-content:space-between;align-items:center}
.cab-h .k{font:600 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--c1)}
.cab-h .ib{width:34px;height:34px}
#cTime{font-family:var(--display);font-weight:900;font-size:86px;line-height:.9;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.01em;text-shadow:0 0 30px color-mix(in srgb,var(--c1) 45%,transparent)}
.cab-bar{height:5px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.cab-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .3s linear}
.presets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:99px;padding:6px 13px;font:600 13px/1 var(--mono)}
.chip.on{background:var(--c1);border-color:var(--c1);color:#140a02}
.chip:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hint{margin:0;font-size:12.5px;color:var(--muted);text-align:center}
.cab-stats{display:flex;justify-content:space-around;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.cab-stats b{display:block;color:var(--text);font:600 18px/1.2 var(--mono)}

/* Editor del set */
#modal{position:fixed;inset:0;z-index:45;background:rgba(3,2,5,.66);backdrop-filter:blur(6px);display:none;place-items:center;padding:18px}
#modal.open{display:grid}
.mcard{width:min(560px,100%);max-height:88vh;overflow:auto;background:#130d1a;border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:14px}
.m-h{display:flex;justify-content:space-between;align-items:center}
.m-h h2{margin:0;font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;line-height:1}
.mcard label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.mcard p{margin:0;font-size:13px;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tlist li{display:flex;gap:8px;align-items:center}
.tlist .no{width:22px;flex:none}
.tlist select{width:auto;flex:none}
.del{border:0;background:none;color:var(--muted);font-size:22px;width:34px;height:34px;border-radius:9px;flex:none}
.del:hover{background:rgba(255,255,255,.07);color:#ff7d6b}
.add-row{display:flex;gap:8px}

/* Avisos pequeños */
#toasts{position:fixed;top:calc(96px + env(safe-area-inset-top));right:22px;z-index:50;display:grid;gap:8px;width:min(300px,calc(100vw - 44px));pointer-events:none}
.toast{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);border-left:3px solid var(--c1);border-radius:12px;padding:10px 14px;animation:tin .35s cubic-bezier(.2,.8,.2,1);transition:opacity .4s,transform .4s}
.toast b{display:block;font-size:14px}
.toast span{font-size:13px;color:var(--muted)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

body.intro #top,body.intro #vu,body.intro #set{opacity:0;pointer-events:none}

@media (max-width:720px){
  #top{padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
  .stat{padding:5px 10px}
  .stat .v{font-size:16px}
  .ib{width:38px;height:38px}
  .venue{font-size:34px}
  .logo-s{font-size:12px;letter-spacing:.24em}
  .set-t{font-size:18px}
  .vprog{width:min(250px,56vw)}
  .vrow{font-size:11px}
  .ex{font-size:12px}
  .trk{padding:10px 11px;gap:6px}
  .tn{font-size:14px}
  #vu{right:10px;transform:translateY(-70%)}
  #vu span{width:8px;height:8px}
  #set{padding:50px 14px calc(14px + env(safe-area-inset-bottom))}
  .trk{flex:0 0 160px}
  #lower{left:14px;bottom:250px}
  #cabin{right:16px;left:16px;top:auto;bottom:16px;width:auto;transform:translateY(30px)}
  body.cab #cabin{transform:none}
  #cTime{font-size:68px}
  .tr .stat:nth-child(2){display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important}
}
</style>
</head>

  'cabin-close':function(){if(T.running){tPause();scratch();toast('Saliste de la cabina','La sesión quedó en pausa.');}cabOpen=false;document.body.classList.remove('cab');render();},
  preset:function(el){if(T.running)return;T.mins=+el.dataset.m;T.left=T.mins*60;S.settings.focus=T.mins;save();render();},
  'c-start':function(){auInit();tStart();render();toast('Estás en cabina','Concéntrate. La pista sigue sonando para ti.');},
  'c-pause':function(){tPause();render();},
  'c-reset':function(){tPause();T.left=T.mins*60;render();}
};
document.addEventListener('click',function(e){var a=e.target.closest('[data-a]');if(!a||a.disabled)return;var f=A[a.dataset.a];if(f)f(a,e);});
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.in==='clabel')T.label=t.value;});
document.addEventListener('change',function(e){var t=e.target,tr;if(!t.dataset)return;
  if(t.dataset.ch==='dj'){S.dj=t.value.trim().slice(0,14)||'DJ';save();}
  if(t.dataset.ch==='tname'){tr=S.tracks.find(function(x){return x.id===t.dataset.id;});if(tr&&t.value.trim()){tr.name=t.value.trim();S.examples=false;save();render();}}
  if(t.dataset.ch==='tfans'){tr=S.tracks.find(function(x){return x.id===t.dataset.id;});if(tr){tr.fans=+t.value;S.examples=false;save();render();}}});
document.addEventListener('keydown',function(e){var t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.enter){e.preventDefault();var f=A[t.dataset.enter];if(f)f(t);}
  if(e.key==='Escape'&&editOpen){editOpen=false;render();}});
window.addEventListener('resize',resize);

if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
applyVenue();resize();render();showIntro();
requestAnimationFrame(frame);
})();
